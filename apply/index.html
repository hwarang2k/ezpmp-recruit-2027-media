<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffad47">
<title>2027 상반기 공개채용 | 이즈피엠피</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:Gmarket;src:url(../assets/gmarket-bold.woff) format("woff");font-weight:700;font-display:swap}
*{box-sizing:border-box}
html{color:#25231e;background:#ffb244;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{margin:0;isolation:isolate}
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(143deg,#fff1a4 0%,#ffbe62 40%,#ff9047 74%,#fce64b)}
.color{position:absolute;inset:-28%;background:radial-gradient(ellipse at 72% 26%,#eeff39 0%,#efff47 9%,transparent 38%),radial-gradient(ellipse at 20% 73%,#ff7029 2%,#ff9c45 19%,transparent 48%),radial-gradient(ellipse at 30% 18%,#ffe6a0 4%,transparent 41%);animation:flow 14s ease-in-out infinite alternate}
@keyframes flow{from{transform:translate(-4%,-6%) rotate(-8deg)}to{transform:translate(6%,6%) rotate(9deg)}}
.ripples{position:absolute;left:45%;top:4%;width:max(82vw,460px);aspect-ratio:1.45;border:1px solid #fff9;border-radius:52% 48% 58% 42%;transform:rotate(-37deg);box-shadow:0 0 0 12px #ffffff1f,0 0 0 13px #ffffff7a,0 0 0 26px #ffffff0a,0 0 0 27px #ffffff65,0 0 0 42px #ffffff0a,0 0 0 43px #ffffff55,0 0 0 59px #ffffff0a,0 0 0 60px #ffffff42}
main{width:min(100%,1000px);min-height:100vh;min-height:100svh;margin:auto;display:grid;align-content:center;padding:max(24px,env(safe-area-inset-top)) clamp(18px,5vw,56px) max(24px,env(safe-area-inset-bottom))}
.panel{display:grid;grid-template-columns:1.05fr 1fr;background:#fffcf4eb;border:1px solid #ffffffd9;border-radius:30px;overflow:hidden;box-shadow:0 16px 65px #67310c1c}
.intro{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:35px;padding:clamp(30px,5vw,56px);background:linear-gradient(150deg,#fffbec70,#fff8dc19);border-right:1px solid #6d4f2024}
.brand{display:block;width:98px;height:auto}
.season{display:block;font-family:Gmarket,sans-serif;font-weight:700;font-size:clamp(21px,3.3vw,32px);letter-spacing:-.05em;line-height:1.25}
h1{margin:6px 0 0;font-family:Gmarket,sans-serif;font-size:clamp(44px,6.1vw,66px);line-height:1.12;letter-spacing:-.075em;word-break:keep-all}
.intro hgroup{margin:0}
.actions{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vw,48px);background:#fffdf7}
h2{margin:0 0 18px;font-size:17px;letter-spacing:-.04em;font-weight:650;color:#514a40}
nav{display:grid;gap:10px}
a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:65px;padding:12px 15px 12px 20px;border:1px solid #ddd6c9;border-radius:15px;background:#fff;color:#28251f;text-decoration:none;touch-action:manipulation;transition:background .18s,border-color .18s,transform .18s}
.label{font-family:Gmarket,sans-serif;font-weight:700;letter-spacing:-.055em;font-size:clamp(16px,3.7vw,20px)}
.go{width:31px;height:31px;position:relative;flex:none;border-radius:50%;background:#fff0d9;color:#7e4114;transition:background .18s,color .18s,transform .18s}
.go:before{content:"";position:absolute;width:12px;height:2px;background:currentColor;left:9px;top:15px;transform:rotate(-45deg)}
.go:after{content:"";width:7px;height:7px;position:absolute;top:9px;right:9px;border:solid currentColor;border-width:2px 2px 0 0}
@media(hover:hover){a:hover{background:#fff9ec;border-color:#ac723d}a:hover .go{transform:translate(1px,-1px);background:#28251f;color:#fff}}
a:focus-visible{outline:3px solid #593911;outline-offset:3px}
a:active{transform:scale(.98);background:#fff0cd}
@media(max-width:680px){main{max-width:500px}.panel{grid-template-columns:1fr;border-radius:26px;background:transparent}.intro{background:linear-gradient(115deg,#fff4cb6b,#fff6d91c);border:0;padding:26px 26px 30px;gap:38px}.actions{padding:24px 22px 26px}h2{font-size:15px;margin-bottom:14px}.brand{width:84px}}
@media(max-height:570px){main{padding-block:max(12px,env(safe-area-inset-bottom))}.intro{gap:16px;padding-block:18px}.actions{padding-block:16px}a{min-height:52px}}
@media(prefers-reduced-motion:reduce){.color{animation:none}a,.go{transition:none}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="color"></div><div class="ripples"></div></div>
<main><div class="panel">
<header class="intro"><img class="brand" src="../assets/ezpmp-logo.png" alt="이즈피엠피" width="495" height="170">
<hgroup><span class="season">2027 상반기</span><h1>공개채용</h1></hgroup></header>
<section class="actions" aria-labelledby="choice"><h2 id="choice">지원할 채용 사이트를 선택하세요.</h2>
<nav aria-label="채용 사이트"><a href="https://url.kr/djvzjp"><span class="label">사람인 바로가기</span><span class="go" aria-hidden="true"></span></a>
<a href="https://url.kr/fz29bb"><span class="label">잡코리아 바로가기</span><span class="go" aria-hidden="true"></span></a></nav></section>
</div></main>
</body></html>
