<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>상·하반기 문화활동비</title><style>
svg{stroke-linecap:round;stroke-linejoin:round}
.trace{stroke-dasharray:1;animation:draw 3.8s ease-in-out infinite}
@keyframes draw{0%,12%{stroke-dashoffset:1}48%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.swing,.lid,.knot,.hand,.music{animation:turn 3.8s ease-in-out infinite}
.swing{--a:-12deg}.lid{--a:-12deg;animation-name:open}.knot{--a:8deg}.hand{--a:75deg}.music{--a:-10deg}
@keyframes turn{0%,12%,86%,100%{transform:rotate(0)}48%{transform:rotate(var(--a))}}
@keyframes open{0%,15%,85%,100%{transform:none}46%,57%{transform:translateY(-5px) rotate(var(--a))}}
.steam{animation:vapor 3s ease-in-out infinite}
@keyframes vapor{0%,100%{opacity:.42;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2.5px)}}
.glow,.spark,.heart{animation:light 3.3s ease-in-out infinite}
@keyframes light{0%,100%{opacity:.64}48%{opacity:1}}
.spark,.heart{animation-name:beat}
@keyframes beat{0%,100%{transform:scale(.82);opacity:.72}48%{transform:scale(1.14);opacity:1}}
.insert,.click{animation:slide 3.8s ease-in-out infinite}
@keyframes slide{0%,100%{transform:none}47%{transform:translateY(-4px)}}.click{animation-name:tap}
@keyframes tap{0%,100%{transform:none}48%{transform:translate(-2px,-2px) scale(.9)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}}
