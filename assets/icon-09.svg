<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>명절 선물</title><style>
svg{stroke-linecap:round;stroke-linejoin:round}
.trace{stroke-dasharray:1;animation:draw 3.8s ease-in-out infinite}
@keyframes draw{0%,12%{stroke-dashoffset:1}48%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.swing,.lid,.knot,.hand,.music{animation:turn 3.8s ease-in-out infinite}
.swing{--a:-12deg}.lid{--a:-12deg;animation-name:open}.knot{--a:8deg}.hand{--a:75deg}.music{--a:-10deg}
@keyframes turn{0%,12%,86%,100%{transform:rotate(0)}48%{transform:rotate(var(--a))}}
@keyframes open{0%,15%,85%,100%{transform:none}46%,57%{transform:translateY(-5px) rotate(var(--a))}}
.steam{animation:vapor 3s ease-in-out infinite}
@keyframes vapor{0%,100%{opacity:.42;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2.5px)}}
.glow,.spark,.heart{animation:light 3.3s ease-in-out infinite}
@keyframes light{0%,100%{opacity:.64}48%{opacity:1}}
.spark,.heart{animation-name:beat}
@keyframes beat{0%,100%{transform:scale(.82);opacity:.72}48%{transform:scale(1.14);opacity:1}}
.insert,.click{animation:slide 3.8s ease-in-out infinite}
@keyframes slide{0%,100%{transform:none}47%{transform:translateY(-4px)}}.click{animation-name:tap}
@keyframes tap{0%,100%{transform:none}48%{transform:translate(-2px,-2px) scale(.9)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}}
</style>
<defs>
  <linearGradient id="ivory" x2=".8" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#e7cfa7"/></linearGradient>
  <linearGradient id="silk" x2=".85" y2="1"><stop stop-color="#ffbc79"/><stop offset=".48" stop-color="#dc7548"/><stop offset="1" stop-color="#aa472e"/></linearGradient>
  <linearGradient id="side" x2="0" y2="1"><stop stop-color="#da895b"/><stop offset="1" stop-color="#9a452d"/></linearGradient>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">
  <path d="M4 29 26 18 60 24 60 44 39 55 4 47Z" fill="url(#ivory)" stroke="#5b4a41" stroke-width="1.9"/>
  <path d="m39 36 21-12v20L39 55Z" fill="url(#side)"/>
  <path d="m4 29 27-6 8 13v18L23 51Z" fill="url(#silk)"/>
  <path d="m4 29 22-11 34 6-21 12Z" fill="#f6e1bd"/>
  <path d="M4 29q14-6 26-7l9 14Z" fill="url(#silk)"/>
  <path d="M31 22q13 3 29 2L41 34Z" fill="#da8057"/>
  <path d="M4 29l35 7 21-12M39 36v18" fill="none" stroke="#685344" stroke-width="1.25"/>
  <path d="M6 31q12 9 17 18m4-23-15 3m19-6q6 6 8 11m-5-12 17 3" fill="none" stroke="#fff3ce" stroke-width="1.05"/>
  <path d="m7 45 30 7m5-1 15-8" fill="none" stroke="#f3cc8a" stroke-width="1.2"/>
  <path d="M4 29 26 18 60 24v20L39 55 4 47Z" fill="none" stroke="#58483f" stroke-width="1.7"/>
  <path d="M29 21c-5 1-11-3-12-8 5-1 11 1 14 6 1-6 7-10 13-9-1 6-5 11-11 13Z" fill="url(#silk)" stroke="#92503b" stroke-width="1.45"/>
  <path d="m20 15 8 5m6-1 7-6" fill="none" stroke="#fce0ac" stroke-width="1.3"/>
  <path d="M30 19q4-1 5 2t-3 4q-4 0-5-2t3-4Z" fill="#f4cf88" stroke="#975230" stroke-width="1.3"/>
  <g class="pendant" style="transform-origin:33px 24px">
    <path d="M33 24q5 5 9 6 4 2 4 6" fill="none" stroke="#936a39" stroke-width="1.5"/>
    <path d="m46 34 2.6 2.8-2.6 2.8-2.6-2.8Z" fill="#f8da92" stroke="#895c37" stroke-width="1"/>
    <path d="m46 39-1.7 5.5m2.4-5 .5 5" fill="none" stroke="#f8d58f" stroke-width="1.5"/>
  </g>
</g>
<style>.pendant{animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}@media(prefers-reduced-motion:reduce){.pendant{animation:none}}</style>
</svg>